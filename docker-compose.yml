# SUMO-GEO — prototype stack.
#   docker compose up --build   ->   open http://localhost:8080
#
# Default is "managed" mode: the backend container runs SUMO itself, so the
# stack is self-contained. To reuse your EXISTING SUMO container instead, start
# it as a TraCI server (e.g. `sumo -c yourcfg --remote-port 8813`), uncomment
# the `sumo` service below, and set APP_SUMO_MODE=remote on the backend.

services:
  backend:
    build: ./backend
    environment:
      APP_SUMO_MODE: managed
      APP_SUMO_CONFIG: /sumo/cuenca.sumocfg   # real Cuenca (run scripts/build_city.sh first); use demo.sumocfg for the synthetic grid
      APP_ORIGIN_LON: "-79.0045"     # anchor for the synthetic (non-geo) demo net
      APP_ORIGIN_LAT: "-2.9006"      # Cuenca, Ecuador
      APP_MAX_FPS: "10"
      # --- remote mode (reuse your own SUMO container) ---
      # APP_SUMO_MODE: remote
      # APP_SUMO_HOST: sumo
      # APP_SUMO_PORT: "8813"
    volumes:
      - ./sumo:/sumo:ro
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - backend

  # --- OPTIONAL: your existing SUMO as a TraCI server (remote mode) ----------
  # sumo:
  #   image: ghcr.io/eclipse-sumo/sumo:v1_27_1     # or your own image
  #   command: >
  #     sumo -c /sumo/cuenca.sumocfg --remote-port 8813
  #          --step-length 1.0 --start --num-clients 1
  #   volumes:
  #     - ./sumo:/sumo:ro
  #   ports:
  #     - "8813:8813"
