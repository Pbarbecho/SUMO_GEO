# SUMO-GEO — prototype stack.
#   docker compose up --build   ->   open http://localhost:8080
#
# Default is "managed" mode: the backend container runs SUMO itself, so the
# stack is self-contained. To reuse your EXISTING SUMO container instead, start
# it as a TraCI server (e.g. `sumo -c yourcfg --remote-port 8813`), uncomment
# the `sumo` service below, and set APP_SUMO_MODE=remote on the backend.

services:
  backend:
    build: ./backend
    environment:
      APP_SUMO_MODE: managed

      # ===== ACTIVE SCENARIO: metro network, traffic concentrated in the centre =====
      
      #APP_SUMO_CONFIG: /mapa/metro_mid.sumocfg
      #APP_SUMO_CONFIG_TEMPLATE: /mapa/metro_{level}.sumocfg
      #APP_VIEW_LON: "-79.004"        # open on downtown (metro's geometric centre is off-centre)
      #APP_VIEW_LAT: "-2.902"
      #APP_SIM_BEGIN: "28800"         # open at the 08:00 peak so there's traffic at once

      # ===== ALTERNATIVE: real OSM centre from scripts/build_city.sh (has 3D buildings) =====
      # 1) Build the map (on the HOST, needs internet):
      #      ./scripts/build_city.sh "-79.010,-2.903,-79.000,-2.893" cuenca
      # 2) Comment out the three metro lines above, then uncomment ONE option:
      #
      #  (a) Just the map + short demo traffic (0-600 s) — no levels:
      APP_SUMO_CONFIG: /sumo/cuenca.sumocfg
      #      (also comment APP_SIM_BEGIN above — the demo starts at t=0)
      #
      #  (b) Full Bajo/Medio/Alto (24 h) + buildings — first also run:
      #      python3 scripts/gen_traffic.py --net sumo/cuenca.net.xml \
      #        --types sumo/vtypes.add.xml --transit sumo/transit.add.xml \
      #        --outdir sumo --prefix cuenca --low 3000 --mid 8000 --high 18000 --bus-share 0.05
      #      APP_SUMO_CONFIG: /sumo/cuenca_mid.sumocfg
      APP_SUMO_CONFIG_TEMPLATE: /sumo/cuenca_{level}.sumocfg
      APP_POLY_FILE: /sumo/cuenca.poly.xml   # buildings (the level cfgs don't list the poly)
      #  The net is already the centre, so APP_VIEW_LON/LAT aren't needed.
      # =====================================================================================

      APP_ORIGIN_LON: "-79.0045"
      APP_ORIGIN_LAT: "-2.9006"
      APP_MAX_FPS: "10"
      # --- remote mode (reuse your own SUMO container) ---
      # APP_SUMO_MODE: remote
      # APP_SUMO_HOST: sumo
      # APP_SUMO_PORT: "8813"
    volumes:
      - ./sumo:/sumo:ro
      - ./mapa:/mapa:ro
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - backend

  # --- OPTIONAL: your existing SUMO as a TraCI server (remote mode) ----------
  # sumo:
  #   image: ghcr.io/eclipse-sumo/sumo:v1_27_1     # or your own image
  #   command: >
  #     sumo -c /sumo/cuenca.sumocfg --remote-port 8813
  #          --step-length 1.0 --start --num-clients 1
  #   volumes:
  #     - ./sumo:/sumo:ro
  #   ports:
  #     - "8813:8813"
