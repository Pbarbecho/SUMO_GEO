# Serves the static frontend and reverse-proxies the API + WebSocket to the
# backend, so the browser talks to a single same-origin host (no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los GeoJSON de la red (varios MB en redes metropolitanas) ya llegan
    # comprimidos y con ETag desde el backend (app/main.py); aquí se comprime
    # el resto (JSON pequeño, JS, CSS) por si algún cliente no lo soporta.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain model/gltf-binary;
    gzip_min_length 1024;
    gzip_proxied any;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;   # respetar gzip del backend
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
        # no-cache (NO no-store): el navegador revalida con ETag/Last-Modified
        # en cada recarga (304 si no cambió) — así cada recarga trae el app.js
        # actual sin volver a descargar 660 KB de modelos glTF cada vez
        add_header Cache-Control "no-cache";
        etag on;
    }
}
