<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUMO-GEO · Simulación de movilidad 3D en el navegador</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>
  <div id="tint"></div>

  <div id="popup"></div>

  <button id="btn-zen" title="Ocultar / mostrar todos los paneles (modo presentación)">⛶</button>

  <div id="histpanel">
    <h1>Históricos</h1>
    <div class="h-block">
      <div class="h-title">Vehículos <b id="h-veh-now">0</b></div>
      <canvas id="h-veh" width="236" height="66"></canvas>
      <div class="h-legend"><i style="background:#4da3ff"></i>autos <i style="background:#fa9614"></i>buses</div>
    </div>
    <div class="h-block">
      <div class="h-title">CO₂ flota <b id="h-co2-now">0 g/s</b></div>
      <canvas id="h-co2" width="236" height="66"></canvas>
    </div>
    <div class="h-block">
      <div class="h-title">Tiempo de viaje medio <b id="h-tt-now">– s</b></div>
      <canvas id="h-tt" width="236" height="66"></canvas>
    </div>
    <div class="h-block">
      <div class="h-title">Espera en semáforos <b id="h-wait-now">– s</b></div>
      <canvas id="h-wait" width="236" height="66"></canvas>
    </div>
    <div class="h-block">
      <div class="h-title">Por tipo (ahora)</div>
      <div id="h-types"></div>
    </div>
  </div>

  <div id="pantilt-wrap">
    <div id="pantilt" class="pad" title="Arrastra: horizontal = giro (pan) · vertical = inclinación (tilt). Doble clic = norte + 3D.">
      <span class="pad-cross"></span>
      <span id="pad-knob" class="pad-knob"></span>
    </div>
    <span id="pt-read" class="pt-read">N 0° · tilt 55°</span>
  </div>

  <div id="topbar">
    <button id="zoom-in" class="icon-btn" title="Acercar">+</button>
    <button id="zoom-out" class="icon-btn" title="Alejar">−</button>
    <span class="topbar-sep"></span>
    <button id="orbit" class="icon-btn" title="Órbita automática">◐</button>
    <button id="view-top" class="icon-btn" title="Vista superior 2D / perspectiva 3D">2D</button>
    <span class="topbar-sep"></span>
    <button id="light-dawn" class="icon-btn" title="Amanecer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M8 18a4 4 0 0 1 8 0"/><path d="M12 3v5m-2-3 2-2 2 2"/></svg>
    </button>
    <button id="light-day" class="icon-btn" title="Día">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
    </button>
    <button id="light-dusk" class="icon-btn" title="Atardecer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M8 18a4 4 0 0 1 8 0"/><path d="M12 8V3m-2 3 2 2 2-2"/></svg>
    </button>
    <button id="light-night" class="icon-btn" title="Noche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>

  <div id="left-col">
  <div id="panel">
    <h1><img src="ucuenca.png" alt="Universidad de Cuenca" class="uc-logo" />SUMO&nbsp;·&nbsp;GEO</h1>
    <div class="uc-sub">Universidad de Cuenca</div>
    <div class="row">
      <button id="btn-play">⏸ Pausar</button>
      <button id="btn-reset">⟳ Reiniciar</button>
    </div>
    <label class="row">
      Escenario
      <select id="level">
        <option value="low">Bajo</option>
        <option value="mid" selected>Medio</option>
        <option value="high">Alto</option>
      </select>
    </label>
    <label class="row">
      Velocidad
      <input id="fps" type="range" min="1" max="30" value="10" />
      <span id="fps-val">10 fps</span>
    </label>
    <label class="row">
      <input id="toggle-buildings" type="checkbox" checked /> Edificios
    </label>
    <label class="row">
      <input id="toggle-congestion" type="checkbox" checked /> Congestión (LOS)
    </label>
    <label class="row">
      <input id="toggle-tl" type="checkbox" checked /> Semáforos
    </label>
    <label class="row">
      <input id="toggle-poi" type="checkbox" /> PoI
    </label>
    <label class="row">
      <input id="toggle-busy" type="checkbox" /> Calles concurridas
    </label>
    <label class="row">
      ≥ <input id="busy-min" type="range" min="1" max="10" value="2" />
      <span id="busy-val">2</span> veh
    </label>
    <div id="stats">
      <div><b id="veh-count">0</b> vehículos</div>
      <div>t = <b id="sim-time">0</b> s</div>
      <div id="conn" class="offline">desconectado</div>
    </div>
    <div id="legend">
      <span>Nivel de servicio</span>
      <div class="ramp">
        <i style="background:#1a9850"></i>A
        <i style="background:#66bd63"></i>B
        <i style="background:#d9ef8b"></i>C
        <i style="background:#fee08b"></i>D
        <i style="background:#fc8d59"></i>E
        <i style="background:#d73027"></i>F
      </div>
    </div>
  </div>

  <div id="replay-panel">
    <h1>Replay&nbsp;V2X</h1>
    <div class="row">
      <button id="btn-replay" title="Reproducir una corrida grabada (.pcap de VaN3Twin) con el intercambio de mensajes V2X">🎞 Replay pcap</button>
    </div>
    <div class="row" id="replay-bar" style="display:none">
      <input id="rp-seek" type="range" min="0" max="100" step="0.5" value="0" style="flex:1" />
      <span id="rp-time" style="font-size:11px;white-space:nowrap">0s</span>
    </div>
    <div class="row" id="replay-step-row" style="display:none">
      <button id="rp-back" class="step-btn" title="Paso atrás: retrocede un frame y pausa">⏮</button>
      <button id="rp-play" class="step-btn" title="Reproducir / pausar el replay">⏸</button>
      <button id="rp-step" class="step-btn" title="Paso adelante: avanza un frame y pausa; los mensajes del paso quedan fijos para inspeccionarlos">⏭</button>
      <select id="veh-filter" title="Mostrar solo los mensajes emitidos por un vehículo" style="flex:1">
        <option value="">All</option>
      </select>
    </div>
    <label class="row" id="row-msgs" style="display:none">
      <input id="toggle-msgs" type="checkbox" checked /> Mensajes V2X
    </label>
    <div class="row" id="row-msg-filter" style="display:none">
      <label><input id="f-cam" type="checkbox" checked /> <span style="color:#4da3ff">CAM</span></label>
      <label><input id="f-cpm" type="checkbox" checked /> <span style="color:#37c871">CPM</span></label>
      <label><input id="f-denm" type="checkbox" checked /> <span style="color:#ff5347">DENM</span></label>
      <label title="Etiqueta de distancia (y RSSI si hay signal-rx.csv) sobre cada enlace"><input id="toggle-arc-lbl" type="checkbox" checked /> m/dBm</label>
    </div>
  </div>

  <div id="phy-panel" style="display:none">
    <h1>PHY&nbsp;802.11p</h1>
    <div id="phy-body" style="font-size:12px;line-height:1.7">cargando…</div>
  </div>
  </div><!-- /left-col -->

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
